<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>SIA · caminho</title>
<link rel="stylesheet" href="base.css">
<style>
  .palco { --w: 1200px; --h: 720px; padding: 64px 84px 0 96px; }
  h2 { font-size: 44px; margin: 14px 0 34px; }
  .grade { display: grid; grid-template-columns: repeat(4, 1fr); grid-auto-rows: 1fr; gap: 20px; }
  .passo { padding: 20px 20px 22px; opacity: 0.42; transition: none; }
  .passo .num {
    width: 38px; height: 38px; border-radius: var(--radius);
    display: flex; align-items: center; justify-content: center;
    font-weight: 800; font-size: 18px;
    background: var(--line); color: #9AA5A1; margin-bottom: 14px;
  }
  .passo .topo { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
  .passo .topo .num { margin-bottom: 0; }
  .sigla { font-weight: 800; font-size: 14px; letter-spacing: 1.5px; color: var(--green); padding: 4px 9px; border-radius: var(--radius); background: var(--tint); border: 1px solid var(--cb); }
  .passo h3 { font-size: 22px; font-weight: 700; letter-spacing: -0.2px; margin-bottom: 6px; }
  .passo p { font-size: 18px; line-height: 1.3; color: var(--gray); }
  .passo.feito { opacity: 1; }
  .passo.feito .num { background: var(--green); color: #FFFFFF; }
  .passo.agora { opacity: 1; box-shadow: var(--cshadow-forte); border-color: rgba(1, 203, 139, 0.55); }
  .passo.agora .num { background: var(--accent); color: #FFFFFF; }
  .destaque {
    margin-top: 26px; padding: 16px 22px; border-radius: var(--radius);
    background: var(--tint); border: 1px solid var(--cb); border-radius: 12px; font-size: 22px; font-weight: 600; color: var(--green);
    visibility: hidden;
  }
  .destaque.on { visibility: visible; }
</style>
</head>
<body>
<div class="palco">
    <div class="marca"><img class="sling" src="marca/sling.webp" alt="Sling"><span class="x"></span><span class="nucleo"><img src="marca/nucleo-simbolo-verde.webp" alt="">Núcleo Pocket</span></div>
  <div class="kicker"><img src="marca/nucleo-simbolo-verde.webp" alt="">Como a conversa anda</div>
  <h2>Oito passos, <span class="verde">um de cada vez</span></h2>
  <div class="grade" id="grade"></div>
  <div class="destaque" id="destaque">Só vira código depois que você viu e concordou</div>
</div>
<script>
const passos = [
  ['Oi', 'O SIA se apresenta e repete o seu pedido numa frase'],
  ['Quem usa', 'Uma pergunta sobre quem vai usar e o que precisa fazer'],
  ['O combinado', 'Um texto curto com o que o sistema faz e o que fica de fora', 'PRD'],
  ['A cara', 'Cores, letras e o jeito das telas, antes de construir', 'DS'],
  ['A base', 'As ferramentas sugeridas, que só valem com o seu sim'],
  ['A lista', 'O trabalho dividido em partes pequenas'],
  ['A prova', 'Cada parte só fecha com um teste passando', 'TDD'],
  ['No ar', 'Publicar, se você quiser que outras pessoas usem'],
];
const grade = document.getElementById('grade');
grade.innerHTML = passos.map(([t, d, s], i) =>
  `<div class="card passo"><div class="topo"><div class="num">${i + 1}</div>${s ? `<span class="sigla">${s}</span>` : ''}</div><h3>${t}</h3><p>${d}</p></div>`).join('');
const cards = [...grade.children];
const destaque = document.getElementById('destaque');

const INICIO = 500, PASSO = 900;
window.DURACAO = 11000;
window.render = (t) => {
  cards.forEach((c, i) => {
    const entra = INICIO + i * PASSO;
    c.classList.toggle('feito', t >= entra);
    c.classList.toggle('agora', t >= entra && t < entra + PASSO && i < cards.length);
  });
  // o último fica em destaque até o fim
  if (t >= INICIO + 7 * PASSO) cards[7].classList.add('agora');
  destaque.classList.toggle('on', t >= INICIO + 8 * PASSO + 300);
};
window.render(window.DURACAO);
</script>
</body>
</html>
